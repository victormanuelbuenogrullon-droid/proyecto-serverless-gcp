swagger: "2.0"
info:
  title: "API Serverless"
  description: "Gateway para backend en Cloud Run"
  version: "1.0.0"
schemes:
  - "https"
produces:
  - "application/json"
paths:
  /{path}:
    parameters:
      - name: path
        in: path
        required: true
        type: string
        description: "Ruta del recurso solicitado"
    get:
      summary: "Proxy GET"
      operationId: "proxyGet"
      x-google-backend:
        address: ${backend_url}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        default:
          description: "Forwarding response"
    post:
      summary: "Proxy POST"
      operationId: "proxyPost"
      x-google-backend:
        address: ${backend_url}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        default:
          description: "Forwarding response"
    put:
      summary: "Proxy PUT"
      operationId: "proxyPut"
      x-google-backend:
        address: ${backend_url}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        default:
          description: "Forwarding response"
    delete:
      summary: "Proxy DELETE"
      operationId: "proxyDelete"
      x-google-backend:
        address: ${backend_url}
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        default:
          description: "Forwarding response"