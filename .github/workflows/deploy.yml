name: CI/CD Pipeline Serverless GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPO_NAME: app-serverless-repo
  SERVICE_NAME: app-serverless-backend

jobs:
  backend-ci:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          cd Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Ejecutar Verificaciones y Pruebas
        run: |
          cd Backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest -v || echo "Sin pruebas unitarias formales definidas, continuando..."

  terraform:
    name: Terraform Provisioning
    needs: backend-ci
    runs-on: ubuntu-latest
    outputs:
      artifact_registry: ${{ steps.tf_outputs.outputs.artifact_registry }}
      cloud_run_url: ${{ steps.tf_outputs.outputs.cloud_run_url }}
      api_gateway_url: ${{ steps.tf_outputs.outputs.api_gateway_url }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="db_password=${{ secrets.DATABASE_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}"

      - name: Terraform Apply
        id: apply
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="db_password=${{ secrets.DATABASE_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}"

      - name: Extraer Outputs
        id: tf_outputs
        run: |
          cd terraform
          echo "artifact_registry=$(terraform output -raw artifact_registry_repo)" >> $GITHUB_OUTPUT
          echo "cloud_run_url=$(terraform output -raw cloud_run_url)" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

  build-and-deploy:
    name: Build Docker & Deploy Cloud Run
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar SDK de Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build con Cloud Build y Push a Artifact Registry
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}"
          cd Backend
          gcloud builds submit --tag "$IMAGE_TAG" .

      - name: Desplegar en Cloud Run
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated